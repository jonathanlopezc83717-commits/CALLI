<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Vista axonométrica de proyecto arquitectónico CALLI">
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#a8d8ff" stroke-width="0.4" opacity="0.5"/>
    </pattern>
    <pattern id="hatch2" patternUnits="userSpaceOnUse" width="4" height="4" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#a8d8ff" stroke-width="0.3" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#0a2540"/>

  <!-- Grid (subtle) -->
  <g stroke="#a8d8ff" stroke-width="0.25" opacity="0.15">
    <g>
      <line x1="0" y1="50" x2="1200" y2="50"/>
      <line x1="0" y1="100" x2="1200" y2="100"/>
      <line x1="0" y1="150" x2="1200" y2="150"/>
      <line x1="0" y1="200" x2="1200" y2="200"/>
      <line x1="0" y1="250" x2="1200" y2="250"/>
      <line x1="0" y1="300" x2="1200" y2="300"/>
      <line x1="0" y1="350" x2="1200" y2="350"/>
      <line x1="0" y1="400" x2="1200" y2="400"/>
      <line x1="0" y1="450" x2="1200" y2="450"/>
      <line x1="0" y1="500" x2="1200" y2="500"/>
      <line x1="0" y1="550" x2="1200" y2="550"/>
      <line x1="0" y1="600" x2="1200" y2="600"/>
      <line x1="0" y1="650" x2="1200" y2="650"/>
      <line x1="0" y1="700" x2="1200" y2="700"/>
      <line x1="0" y1="750" x2="1200" y2="750"/>
    </g>
    <g>
      <line x1="50" y1="0" x2="50" y2="800"/>
      <line x1="100" y1="0" x2="100" y2="800"/>
      <line x1="150" y1="0" x2="150" y2="800"/>
      <line x1="200" y1="0" x2="200" y2="800"/>
      <line x1="250" y1="0" x2="250" y2="800"/>
      <line x1="300" y1="0" x2="300" y2="800"/>
      <line x1="350" y1="0" x2="350" y2="800"/>
      <line x1="400" y1="0" x2="400" y2="800"/>
      <line x1="450" y1="0" x2="450" y2="800"/>
      <line x1="500" y1="0" x2="500" y2="800"/>
      <line x1="550" y1="0" x2="550" y2="800"/>
      <line x1="600" y1="0" x2="600" y2="800"/>
      <line x1="650" y1="0" x2="650" y2="800"/>
      <line x1="700" y1="0" x2="700" y2="800"/>
      <line x1="750" y1="0" x2="750" y2="800"/>
      <line x1="800" y1="0" x2="800" y2="800"/>
      <line x1="850" y1="0" x2="850" y2="800"/>
      <line x1="900" y1="0" x2="900" y2="800"/>
      <line x1="950" y1="0" x2="950" y2="800"/>
      <line x1="1000" y1="0" x2="1000" y2="800"/>
      <line x1="1050" y1="0" x2="1050" y2="800"/>
      <line x1="1100" y1="0" x2="1100" y2="800"/>
      <line x1="1150" y1="0" x2="1150" y2="800"/>
    </g>
  </g>

  <!-- Axonometric building - main volume -->
  <g stroke="#e0f2fe" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- Top of volume (flat roof with parapet) -->
    <polygon points="280,310 720,250 880,300 720,360 280,360" fill="#0a2540" stroke-width="1.8"/>
    <line x1="280" y1="310" x2="720" y2="250" stroke-width="1.2" opacity="0.6"/>
    <line x1="720" y1="250" x2="880" y2="300" stroke-width="1.2" opacity="0.6"/>
    <line x1="880" y1="300" x2="720" y2="360" stroke-width="1.2" opacity="0.6"/>
    <line x1="720" y1="360" x2="280" y2="360" stroke-width="1.2" opacity="0.6"/>

    <!-- Roof details (parapet edge) -->
    <line x1="280" y1="310" x2="280" y2="358" stroke-width="1.5" stroke="#a8d8ff"/>
    <line x1="720" y1="250" x2="720" y2="358" stroke-width="1.5" stroke="#a8d8ff"/>
    <line x1="720" y1="358" x2="280" y2="358" stroke-width="1.5" stroke="#a8d8ff"/>

    <!-- Front face (right side) -->
    <polygon points="720,360 880,300 880,500 720,560" fill="#0a2540" stroke-width="1.8"/>

    <!-- Side face (front) -->
    <polygon points="280,360 720,360 720,560 280,560" fill="#0d3b66" fill-opacity="0.4" stroke-width="1.8"/>

    <!-- Window on front (large glass) -->
    <polygon points="320,400 660,400 660,500 320,500" stroke-width="0.8" opacity="0.85"/>
    <line x1="490" y1="400" x2="490" y2="500" stroke-width="0.5" opacity="0.6"/>
    <line x1="320" y1="450" x2="660" y2="450" stroke-width="0.5" opacity="0.6"/>
    <!-- Mullion verticals -->
    <line x1="400" y1="400" x2="400" y2="500" stroke-width="0.4" opacity="0.5"/>
    <line x1="580" y1="400" x2="580" y2="500" stroke-width="0.4" opacity="0.5"/>

    <!-- Door -->
    <rect x="320" y="500" width="100" height="60" stroke-width="0.8" opacity="0.85"/>
    <line x1="370" y1="500" x2="370" y2="560" stroke-width="0.5" opacity="0.6"/>
    <line x1="370" y1="500" x2="320" y2="510" stroke-width="0.4" stroke-dasharray="2,2" opacity="0.5"/>

    <!-- Right face window -->
    <polygon points="745,400 855,355 855,460 745,500" stroke-width="0.8" opacity="0.85"/>
    <line x1="800" y1="378" x2="800" y2="480" stroke-width="0.4" opacity="0.5"/>

    <!-- Second volume (perpendicular L-shape, smaller) -->
    <polygon points="280,360 280,560 200,560 200,420 280,420" fill="#0d3b66" fill-opacity="0.3" stroke-width="1.5"/>
    <polygon points="280,360 200,420 200,420 200,420 280,360" stroke-width="1.2" opacity="0.5"/>
    <polygon points="280,420 200,420 200,420 200,420 280,420" stroke-width="0" opacity="0"/>
    <line x1="280" y1="360" x2="280" y2="420" stroke-width="0" opacity="0"/>
    <polygon points="280,360 200,360 200,420 280,420" fill="#0d3b66" fill-opacity="0.3" stroke-width="1.2"/>
    <polygon points="280,360 200,360 200,420 280,420" fill="url(#hatch2)" stroke-width="0.4" opacity="0.5"/>

    <!-- Roof of second volume -->
    <polygon points="280,360 200,360 200,330 280,330" fill="#0a2540" stroke-width="1.2"/>
    <line x1="280" y1="330" x2="200" y2="330" stroke-width="1.2"/>

    <!-- Window on second volume -->
    <rect x="220" y="440" width="50" height="80" stroke-width="0.7" opacity="0.8"/>

    <!-- Terrace/patio extending from main volume -->
    <polygon points="280,560 720,560 720,610 280,610" fill="#0a2540" stroke-width="0.8" opacity="0.7"/>
    <polygon points="720,560 880,500 880,550 720,610" fill="#0a2540" stroke-width="0.8" opacity="0.7"/>
    <line x1="280" y1="585" x2="720" y2="585" stroke-width="0.5" opacity="0.5" stroke-dasharray="3,3"/>

    <!-- Ground level (terrain line) -->
    <line x1="100" y1="610" x2="900" y2="610" stroke-width="1.2"/>
    <line x1="100" y1="610" x2="80" y2="620" stroke-width="0.5" opacity="0.5"/>
    <line x1="120" y1="610" x2="100" y2="620" stroke-width="0.5" opacity="0.5"/>
    <line x1="140" y1="610" x2="120" y2="620" stroke-width="0.5" opacity="0.5"/>
    <line x1="160" y1="610" x2="140" y2="620" stroke-width="0.5" opacity="0.5"/>
    <line x1="180" y1="610" x2="160" y2="620" stroke-width="0.5" opacity="0.5"/>
    <line x1="880" y1="610" x2="900" y2="620" stroke-width="0.5" opacity="0.5"/>
    <line x1="860" y1="610" x2="880" y2="620" stroke-width="0.5" opacity="0.5"/>
    <line x1="840" y1="610" x2="860" y2="620" stroke-width="0.5" opacity="0.5"/>
    <line x1="820" y1="610" x2="840" y2="620" stroke-width="0.5" opacity="0.5"/>
    <line x1="800" y1="610" x2="820" y2="620" stroke-width="0.5" opacity="0.5"/>

    <!-- Pool -->
    <polygon points="850,560 1000,500 1050,520 920,580" stroke-width="1.2" fill="none"/>
    <line x1="860" y1="565" x2="990" y2="510" stroke-width="0.4" opacity="0.5"/>
    <line x1="870" y1="572" x2="1010" y2="520" stroke-width="0.4" opacity="0.5"/>

    <!-- Trees (circles for canopies) -->
    <circle cx="170" cy="600" r="22" stroke-width="0.8" opacity="0.7"/>
    <circle cx="170" cy="600" r="14" stroke-width="0.5" opacity="0.5"/>
    <line x1="170" y1="600" x2="170" y2="615" stroke-width="0.6" opacity="0.6"/>

    <circle cx="150" cy="650" r="28" stroke-width="0.8" opacity="0.7"/>
    <circle cx="150" cy="650" r="18" stroke-width="0.5" opacity="0.5"/>
    <line x1="150" y1="650" x2="150" y2="675" stroke-width="0.6" opacity="0.6"/>

    <circle cx="950" cy="640" r="25" stroke-width="0.8" opacity="0.7"/>
    <circle cx="950" cy="640" r="16" stroke-width="0.5" opacity="0.5"/>
    <line x1="950" y1="640" x2="950" y2="660" stroke-width="0.6" opacity="0.6"/>

    <!-- Steps from terrace to garden -->
    <line x1="450" y1="610" x2="450" y2="630" stroke-width="0.7"/>
    <line x1="470" y1="610" x2="470" y2="630" stroke-width="0.7"/>
    <line x1="490" y1="610" x2="490" y2="630" stroke-width="0.7"/>
    <line x1="510" y1="610" x2="510" y2="630" stroke-width="0.7"/>
    <line x1="530" y1="610" x2="530" y2="630" stroke-width="0.7"/>
    <line x1="450" y1="630" x2="530" y2="630" stroke-width="0.7"/>

  </g>

  <!-- Dimension lines -->
  <g stroke="#a8d8ff" stroke-width="0.6" fill="none" opacity="0.85">
    <!-- Bottom dimension (width) -->
    <line x1="200" y1="680" x2="200" y2="700"/>
    <line x1="720" y1="680" x2="720" y2="700"/>
    <line x1="200" y1="690" x2="720" y2="690"/>
    <polygon points="200,690 210,687 210,693" fill="#a8d8ff" stroke="none"/>
    <polygon points="720,690 710,687 710,693" fill="#a8d8ff" stroke="none"/>

    <!-- Right dimension (depth) -->
    <line x1="900" y1="500" x2="940" y2="480"/>
    <line x1="1050" y1="500" x2="1100" y2="480"/>
    <line x1="1020" y1="490" x2="1020" y2="495" stroke-dasharray="2,2" opacity="0.5"/>

    <!-- Left height dimension -->
    <line x1="160" y1="310" x2="180" y2="310"/>
    <line x1="160" y1="560" x2="180" y2="560"/>
    <line x1="170" y1="310" x2="170" y2="560" stroke-dasharray="3,3" opacity="0.4"/>
  </g>

  <!-- Dimension text -->
  <g fill="#a8d8ff" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" letter-spacing="0.05em">
    <text x="460" y="710" text-anchor="middle">12.40 m</text>
    <text x="130" y="440" transform="rotate(-90 130 440)" text-anchor="middle">3.20 m</text>
    <text x="1040" y="510" text-anchor="middle" transform="rotate(-15 1040 510)">8.00 m</text>
  </g>

  <!-- Axis labels -->
  <g fill="#7dd3fc" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" font-weight="500" opacity="0.9">
    <text x="80" y="155">A</text>
    <text x="80" y="305">B</text>
    <text x="80" y="455">C</text>
    <text x="220" y="745">1</text>
    <text x="400" y="745">2</text>
    <text x="580" y="745">3</text>
    <text x="760" y="745">4</text>
    <text x="940" y="745">5</text>
  </g>

  <!-- Compass / North arrow (top right) -->
  <g transform="translate(1090, 110)" stroke="#e0f2fe" fill="none" stroke-width="1.2">
    <circle r="32"/>
    <circle r="26" stroke-width="0.4" opacity="0.5"/>
    <line x1="0" y1="-32" x2="0" y2="32" stroke-width="0.4" opacity="0.4"/>
    <line x1="-32" y1="0" x2="32" y2="0" stroke-width="0.4" opacity="0.4"/>
    <polygon points="0,-30 -6,0 0,-8 6,0" fill="#e0f2fe" stroke="none"/>
    <polygon points="0,30 -6,0 0,8 6,0" fill="#a8d8ff" stroke="none" opacity="0.5"/>
    <text y="-38" text-anchor="middle" fill="#e0f2fe" font-family="ui-monospace, monospace" font-size="11" stroke="none">N</text>
  </g>

  <!-- Scale bar (bottom right) -->
  <g transform="translate(1000, 760)" stroke="#a8d8ff" fill="none">
    <line x1="0" y1="0" x2="120" y2="0" stroke-width="1"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke-width="1"/>
    <line x1="30" y1="-3" x2="30" y2="3" stroke-width="0.6"/>
    <line x1="60" y1="-3" x2="60" y2="3" stroke-width="0.6"/>
    <line x1="90" y1="-3" x2="90" y2="3" stroke-width="0.6"/>
    <line x1="120" y1="-4" x2="120" y2="4" stroke-width="1"/>
    <text x="60" y="18" text-anchor="middle" fill="#a8d8ff" font-family="ui-monospace, monospace" font-size="9" stroke="none">ESC 1:100 · 0—3m</text>
  </g>

  <!-- Title block label (top left) -->
  <g transform="translate(60, 60)" fill="#e0f2fe" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text font-size="10" letter-spacing="0.2em" opacity="0.7">LAM. A-01 / AXONOMETRÍA</text>
    <text y="18" font-size="14" letter-spacing="0.1em" font-weight="500">CASA AZTAHUACÁN</text>
    <text y="36" font-size="9" letter-spacing="0.2em" opacity="0.6">PROYECTO RESIDENCIAL · 2026</text>
  </g>

  <!-- Detail callouts -->
  <g stroke="#7dd3fc" stroke-width="0.5" fill="none" opacity="0.7">
    <circle cx="490" cy="450" r="14" fill="#0a2540"/>
    <text x="490" y="454" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="11" font-weight="500">1</text>
    <line x1="504" y1="450" x2="640" y2="380" stroke-dasharray="2,2"/>
  </g>
  <text x="650" y="375" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="9" opacity="0.8">① FACHADA VIDRIO DVH</text>

  <g stroke="#7dd3fc" stroke-width="0.5" fill="none" opacity="0.7">
    <circle cx="950" cy="540" r="14" fill="#0a2540"/>
    <text x="950" y="544" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="11" font-weight="500">2</text>
    <line x1="936" y1="540" x2="780" y2="500" stroke-dasharray="2,2"/>
  </g>
  <text x="640" y="495" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="9" opacity="0.8">② ALBERCA 4×8m</text>
</svg>
