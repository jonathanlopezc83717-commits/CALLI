<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Plano arquitectónico Casa Aztahuacán">
  <defs>
    <pattern id="grid1" patternUnits="userSpaceOnUse" width="20" height="20">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#a8d8ff" stroke-width="0.2" opacity="0.2"/>
    </pattern>
    <pattern id="tile" patternUnits="userSpaceOnUse" width="15" height="15">
      <rect width="15" height="15" fill="none"/>
      <line x1="0" y1="15" x2="15" y2="0" stroke="#a8d8ff" stroke-width="0.3" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#0a2540"/>
  <rect width="1200" height="800" fill="url(#grid1)"/>

  <!-- Plot boundary -->
  <g stroke="#a8d8ff" stroke-width="0.6" stroke-dasharray="6,4" fill="none" opacity="0.6">
    <rect x="120" y="120" width="960" height="560"/>
  </g>

  <!-- House exterior walls (thick) -->
  <g fill="#e0f2fe" stroke="#e0f2fe" stroke-width="0.5" opacity="0.95">
    <!-- Top wall -->
    <rect x="200" y="220" width="720" height="8"/>
    <!-- Right wall -->
    <rect x="912" y="220" width="8" height="380"/>
    <!-- Bottom wall -->
    <rect x="200" y="592" width="720" height="8"/>
    <!-- Left wall -->
    <rect x="200" y="220" width="8" height="380"/>
  </g>

  <!-- Inner walls -->
  <g stroke="#e0f2fe" stroke-width="1.5" fill="none">
    <!-- Vertical wall between social/private areas -->
    <line x1="630" y1="220" x2="630" y2="430"/>
    <!-- Master bedroom wall -->
    <line x1="630" y1="430" x2="630" y2="600"/>
    <!-- Master bath wall -->
    <line x1="780" y1="430" x2="780" y2="600"/>
    <line x1="630" y1="510" x2="780" y2="510"/>
    <!-- Bedroom 2 wall -->
    <line x1="200" y1="430" x2="350" y2="430"/>
    <line x1="350" y1="430" x2="350" y2="600"/>
    <!-- Bath 2 wall -->
    <line x1="200" y1="510" x2="350" y2="510"/>
  </g>

  <!-- Door openings (gaps in walls) -->
  <g fill="#0a2540">
    <!-- Main entry -->
    <rect x="460" y="220" width="60" height="8"/>
    <!-- Master bedroom -->
    <rect x="630" y="370" width="8" height="50"/>
    <!-- Bedroom 2 -->
    <rect x="350" y="430" width="8" height="50"/>
    <rect x="270" y="427" width="50" height="8"/>
    <!-- Bath 2 -->
    <rect x="290" y="510" width="8" height="50"/>
    <!-- Master bath -->
    <rect x="700" y="510" width="8" height="50"/>
  </g>

  <!-- Door swings -->
  <g stroke="#a8d8ff" stroke-width="0.6" fill="none" opacity="0.7">
    <path d="M 460 220 A 50 50 0 0 1 510 270"/>
    <path d="M 630 370 A 45 45 0 0 0 675 415"/>
    <path d="M 350 430 A 45 45 0 0 0 305 475"/>
    <path d="M 270 430 A 45 45 0 0 1 315 385"/>
    <path d="M 290 510 A 45 45 0 0 0 335 555"/>
    <path d="M 700 510 A 45 45 0 0 0 655 555"/>
  </g>

  <!-- Windows (double parallel lines) -->
  <g stroke="#a8d8ff" stroke-width="1" fill="none" opacity="0.9">
    <!-- Living room window (top) -->
    <line x1="220" y1="220" x2="430" y2="220"/>
    <line x1="220" y1="226" x2="430" y2="226"/>
    <line x1="240" y1="220" x2="240" y2="226"/>
    <line x1="280" y1="220" x2="280" y2="226"/>
    <line x1="320" y1="220" x2="320" y2="226"/>
    <line x1="360" y1="220" x2="360" y2="226"/>
    <line x1="400" y1="220" x2="400" y2="226"/>

    <!-- Kitchen window (top) -->
    <line x1="540" y1="220" x2="610" y2="220"/>
    <line x1="540" y1="226" x2="610" y2="226"/>
    <line x1="555" y1="220" x2="555" y2="226"/>
    <line x1="575" y1="220" x2="575" y2="226"/>
    <line x1="595" y1="220" x2="595" y2="226"/>

    <!-- Master bedroom window (right) -->
    <line x1="920" y1="240" x2="920" y2="340"/>
    <line x1="914" y1="240" x2="914" y2="340"/>
    <line x1="920" y1="260" x2="914" y2="260"/>
    <line x1="920" y1="285" x2="914" y2="285"/>
    <line x1="920" y1="310" x2="914" y2="310"/>

    <!-- Bedroom 2 window (left) -->
    <line x1="200" y1="240" x2="200" y2="320"/>
    <line x1="206" y1="240" x2="206" y2="320"/>
    <line x1="200" y1="260" x2="206" y2="260"/>
    <line x1="200" y1="280" x2="206" y2="280"/>
    <line x1="200" y1="300" x2="206" y2="300"/>

    <!-- Bath 2 window -->
    <line x1="200" y1="540" x2="200" y2="580"/>
    <line x1="206" y1="540" x2="206" y2="580"/>

    <!-- Master bath window -->
    <line x1="920" y1="540" x2="920" y2="580"/>
    <line x1="914" y1="540" x2="914" y2="580"/>

    <!-- Living room glass doors to terrace (bottom) -->
    <line x1="220" y1="600" x2="430" y2="600"/>
    <line x1="220" y1="594" x2="430" y2="594"/>
    <line x1="240" y1="600" x2="240" y2="594"/>
    <line x1="320" y1="600" x2="320" y2="594"/>
    <line x1="400" y1="600" x2="400" y2="594"/>
  </g>

  <!-- Furniture: Living room (sofa, chairs, table) -->
  <g stroke="#e0f2fe" stroke-width="0.8" fill="none" opacity="0.85">
    <!-- Sofa -->
    <rect x="260" y="330" width="180" height="40" rx="4" ry="4"/>
    <line x1="260" y1="345" x2="440" y2="345" stroke-width="0.4" opacity="0.6"/>
    <!-- Coffee table -->
    <rect x="290" y="395" width="120" height="50" rx="3" ry="3"/>
    <line x1="300" y1="405" x2="400" y2="405" stroke-width="0.3" opacity="0.5"/>
    <!-- Armchairs -->
    <rect x="230" y="475" width="40" height="40" rx="3" ry="3"/>
    <rect x="430" y="475" width="40" height="40" rx="3" ry="3"/>
  </g>

  <!-- Kitchen -->
  <g stroke="#e0f2fe" stroke-width="0.8" fill="none" opacity="0.85">
    <!-- Counter L-shape -->
    <rect x="220" y="240" width="200" height="50"/>
    <line x1="320" y1="240" x2="320" y2="290"/>
    <line x1="220" y1="265" x2="420" y2="265" stroke-width="0.4" opacity="0.5"/>
    <!-- Sink -->
    <rect x="240" y="248" width="40" height="14"/>
    <circle cx="250" cy="255" r="1.5" fill="#a8d8ff"/>
    <circle cx="270" cy="255" r="1.5" fill="#a8d8ff"/>
    <!-- Stove -->
    <rect x="350" y="248" width="40" height="14"/>
    <circle cx="360" cy="255" r="3"/>
    <circle cx="375" cy="255" r="3"/>
    <!-- Island -->
    <rect x="380" y="320" width="120" height="60"/>
    <line x1="380" y1="340" x2="500" y2="340" stroke-width="0.3" opacity="0.5"/>
    <!-- Refrigerator -->
    <rect x="220" y="170" width="60" height="40"/>
  </g>

  <!-- Dining table -->
  <g stroke="#e0f2fe" stroke-width="0.8" fill="none" opacity="0.85">
    <rect x="540" y="280" width="80" height="50"/>
  </g>
  <g stroke="#a8d8ff" stroke-width="0.5" fill="none" opacity="0.6">
    <circle cx="555" cy="350" r="6"/>
    <circle cx="580" cy="350" r="6"/>
    <circle cx="605" cy="350" r="6"/>
    <circle cx="555" cy="380" r="6"/>
    <circle cx="580" cy="380" r="6"/>
    <circle cx="605" cy="380" r="6"/>
  </g>

  <!-- Bedrooms -->
  <g stroke="#e0f2fe" stroke-width="0.8" fill="none" opacity="0.85">
    <!-- Master bed -->
    <rect x="680" y="280" width="180" height="100" rx="2" ry="2"/>
    <rect x="700" y="290" width="140" height="20"/>
    <line x1="680" y1="320" x2="860" y2="320" stroke-width="0.4" opacity="0.6"/>
    <!-- Nightstands -->
    <rect x="660" y="295" width="20" height="30"/>
    <rect x="860" y="295" width="20" height="30"/>

    <!-- Bedroom 2 bed -->
    <rect x="220" y="460" width="110" height="80" rx="2" ry="2"/>
    <rect x="235" y="465" width="80" height="15"/>
    <line x1="220" y1="490" x2="330" y2="490" stroke-width="0.4" opacity="0.6"/>
  </g>

  <!-- Bathrooms -->
  <g stroke="#e0f2fe" stroke-width="0.8" fill="none" opacity="0.85">
    <!-- Master bath -->
    <!-- WC -->
    <rect x="650" y="530" width="22" height="35"/>
    <ellipse cx="661" cy="530" rx="11" ry="4"/>
    <!-- Double sink -->
    <rect x="690" y="530" width="70" height="25"/>
    <circle cx="710" cy="542" r="4"/>
    <circle cx="740" cy="542" r="4"/>
    <!-- Shower -->
    <rect x="800" y="525" width="100" height="55"/>
    <line x1="800" y1="550" x2="900" y2="550" stroke-width="0.4" opacity="0.5"/>
    <circle cx="850" cy="540" r="1.5" fill="#a8d8ff"/>

    <!-- Bath 2 -->
    <rect x="220" y="530" width="20" height="32"/>
    <ellipse cx="230" cy="530" rx="10" ry="4"/>
    <rect x="252" y="530" width="35" height="22"/>
    <circle cx="269" cy="541" r="3"/>
    <rect x="220" y="570" width="110" height="22" stroke-dasharray="3,3"/>
  </g>

  <!-- Pool (outside, in garden) -->
  <g stroke="#e0f2fe" stroke-width="1.2" fill="none" opacity="0.9">
    <rect x="100" y="650" width="160" height="80" rx="2" ry="2"/>
    <line x1="110" y1="665" x2="250" y2="665" stroke-width="0.4" opacity="0.6"/>
    <line x1="110" y1="680" x2="250" y2="680" stroke-width="0.4" opacity="0.6"/>
    <line x1="110" y1="695" x2="250" y2="695" stroke-width="0.4" opacity="0.6"/>
    <line x1="110" y1="710" x2="250" y2="710" stroke-width="0.4" opacity="0.6"/>
  </g>

  <!-- Terrace -->
  <g stroke="#a8d8ff" stroke-width="0.6" fill="none" stroke-dasharray="3,3" opacity="0.6">
    <rect x="200" y="608" width="720" height="50"/>
  </g>

  <!-- Garden trees -->
  <g stroke="#e0f2fe" stroke-width="0.6" fill="none" opacity="0.75">
    <circle cx="350" cy="680" r="14"/>
    <circle cx="350" cy="680" r="9" stroke-width="0.4" opacity="0.5"/>
    <circle cx="500" cy="700" r="18"/>
    <circle cx="500" cy="700" r="12" stroke-width="0.4" opacity="0.5"/>
    <circle cx="750" cy="680" r="16"/>
    <circle cx="750" cy="680" r="10" stroke-width="0.4" opacity="0.5"/>
    <circle cx="950" cy="690" r="20"/>
    <circle cx="950" cy="690" r="13" stroke-width="0.4" opacity="0.5"/>
    <circle cx="1080" cy="700" r="14"/>
    <circle cx="1080" cy="700" r="9" stroke-width="0.4" opacity="0.5"/>
    <line x1="350" y1="694" x2="350" y2="700" stroke-width="0.4"/>
    <line x1="500" y1="718" x2="500" y2="725" stroke-width="0.4"/>
    <line x1="750" y1="696" x2="750" y2="702" stroke-width="0.4"/>
    <line x1="950" y1="710" x2="950" y2="718" stroke-width="0.4"/>
  </g>

  <!-- North arrow -->
  <g transform="translate(1080, 80)" stroke="#e0f2fe" fill="none" stroke-width="1.2">
    <circle r="28"/>
    <line x1="0" y1="-28" x2="0" y2="28" stroke-width="0.4" opacity="0.4"/>
    <line x1="-28" y1="0" x2="28" y2="0" stroke-width="0.4" opacity="0.4"/>
    <polygon points="0,-26 -5,2 0,-6 5,2" fill="#e0f2fe" stroke="none"/>
    <polygon points="0,26 -5,-2 0,6 5,-2" fill="#a8d8ff" stroke="none" opacity="0.5"/>
    <text y="-34" text-anchor="middle" fill="#e0f2fe" font-family="ui-monospace, monospace" font-size="10" stroke="none">N</text>
  </g>

  <!-- Dimension lines -->
  <g stroke="#a8d8ff" stroke-width="0.6" fill="none" opacity="0.85">
    <!-- Top dimension (house width) -->
    <line x1="200" y1="180" x2="200" y2="215"/>
    <line x1="920" y1="180" x2="920" y2="215"/>
    <line x1="200" y1="195" x2="920" y2="195"/>
    <polygon points="200,195 210,192 210,198" fill="#a8d8ff" stroke="none"/>
    <polygon points="920,195 910,192 910,198" fill="#a8d8ff" stroke="none"/>

    <!-- Left dimension (house height) -->
    <line x1="160" y1="220" x2="195" y2="220"/>
    <line x1="160" y1="600" x2="195" y2="600"/>
    <line x1="175" y1="220" x2="175" y2="600" stroke-dasharray="3,3" opacity="0.5"/>
  </g>

  <!-- Dimension text -->
  <g fill="#a8d8ff" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" letter-spacing="0.05em">
    <text x="560" y="190" text-anchor="middle">16.50 m</text>
    <text x="130" y="410" text-anchor="middle" transform="rotate(-90 130 410)">8.80 m</text>
  </g>

  <!-- Axis labels -->
  <g fill="#7dd3fc" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="500" opacity="0.85">
    <text x="195" y="168">A</text>
    <text x="395" y="168">B</text>
    <text x="595" y="168">C</text>
    <text x="795" y="168">D</text>
    <text x="915" y="168">E</text>
    <text x="155" y="225">1</text>
    <text x="155" y="415">2</text>
    <text x="155" y="595">3</text>
  </g>

  <!-- Room labels -->
  <g fill="#e0f2fe" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.1em">
    <text x="380" y="265" text-anchor="middle" font-size="9" opacity="0.85">COCINA</text>
    <text x="580" y="250" text-anchor="middle" font-size="9" opacity="0.85">COMEDOR</text>
    <text x="380" y="480" text-anchor="middle" font-size="10" opacity="0.85">SALA</text>
    <text x="270" y="500" text-anchor="middle" font-size="8" opacity="0.75">REC 02</text>
    <text x="770" y="370" text-anchor="middle" font-size="10" opacity="0.85">REC. PRINCIPAL</text>
    <text x="665" y="560" text-anchor="middle" font-size="8" opacity="0.75">BAÑO</text>
    <text x="270" y="560" text-anchor="middle" font-size="8" opacity="0.75">BAÑO 02</text>
    <text x="190" y="690" font-size="8" opacity="0.75" transform="rotate(-90 190 690)">ALBERCA</text>
  </g>

  <!-- Title block (bottom left) -->
  <g transform="translate(60, 720)">
    <rect width="320" height="60" fill="none" stroke="#a8d8ff" stroke-width="0.6"/>
    <line x1="0" y1="20" x2="320" y2="20" stroke="#a8d8ff" stroke-width="0.4"/>
    <line x1="220" y1="0" x2="220" y2="60" stroke="#a8d8ff" stroke-width="0.4"/>
    <g fill="#e0f2fe" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
      <text x="8" y="14" font-size="8" opacity="0.7" letter-spacing="0.15em">LAM. R-01 · PLANTA ARQUITECTÓNICA</text>
      <text x="8" y="36" font-size="11" letter-spacing="0.1em" font-weight="500">CASA AZTAHUACÁN</text>
      <text x="8" y="52" font-size="8" opacity="0.65" letter-spacing="0.1em">RESIDENCIAL · 2026</text>
      <text x="230" y="36" font-size="8" opacity="0.7" letter-spacing="0.1em">ESCALA</text>
      <text x="230" y="52" font-size="11" font-weight="500">1 : 75</text>
    </g>
  </g>

  <!-- Scale bar -->
  <g transform="translate(960, 750)" stroke="#a8d8ff" fill="none">
    <line x1="0" y1="0" x2="120" y2="0" stroke-width="0.8"/>
    <line x1="0" y1="-3" x2="0" y2="3" stroke-width="0.8"/>
    <line x1="30" y1="-2" x2="30" y2="2" stroke-width="0.5"/>
    <line x1="60" y1="-2" x2="60" y2="2" stroke-width="0.5"/>
    <line x1="90" y1="-2" x2="90" y2="2" stroke-width="0.5"/>
    <line x1="120" y1="-3" x2="120" y2="3" stroke-width="0.8"/>
    <text x="60" y="15" text-anchor="middle" fill="#a8d8ff" font-family="ui-monospace, monospace" font-size="8" stroke="none">0—3 m</text>
  </g>
</svg>
