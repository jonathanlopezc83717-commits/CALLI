<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Plano urbano de desarrollo mixto">
  <defs>
    <pattern id="grid3" patternUnits="userSpaceOnUse" width="20" height="20">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#a8d8ff" stroke-width="0.2" opacity="0.2"/>
    </pattern>
    <pattern id="hatch3" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#a8d8ff" stroke-width="0.4" opacity="0.4"/>
    </pattern>
    <pattern id="dots3" patternUnits="userSpaceOnUse" width="6" height="6">
      <circle cx="3" cy="3" r="0.4" fill="#a8d8ff" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#0a2540"/>
  <rect width="1200" height="800" fill="url(#grid3)"/>

  <!-- Street grid (surrounding) -->
  <g stroke="#a8d8ff" stroke-width="0.5" fill="none" opacity="0.5">
    <!-- Horizontal street (top) -->
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="124" x2="1200" y2="124"/>
    <!-- Horizontal street (bottom) -->
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="0" y1="704" x2="1200" y2="704"/>
    <!-- Vertical street (left) -->
    <line x1="80" y1="0" x2="80" y2="800"/>
    <line x1="84" y1="0" x2="84" y2="800"/>
    <!-- Vertical street (right) -->
    <line x1="1116" y1="0" x2="1116" y2="800"/>
    <line x1="1120" y1="0" x2="1120" y2="800"/>
  </g>

  <!-- Street labels -->
  <g fill="#a8d8ff" font-family="ui-monospace, monospace" font-size="9" letter-spacing="0.15em" opacity="0.7">
    <text x="100" y="105">AV. INDEPENDENCIA</text>
    <text x="1100" y="105" text-anchor="end">N</text>
    <text x="100" y="725">CALLE MORELOS</text>
    <text x="50" y="400" text-anchor="middle" transform="rotate(-90 50 400)">CALLE HIDALGO</text>
    <text x="1150" y="400" text-anchor="middle" transform="rotate(-90 1150 400)">AV. REFORMA</text>
  </g>

  <!-- Sidewalk texture -->
  <g stroke="#a8d8ff" stroke-width="0.3" fill="none" opacity="0.4">
    <line x1="92" y1="124" x2="92" y2="700"/>
    <line x1="100" y1="124" x2="100" y2="700"/>
    <line x1="108" y1="124" x2="108" y2="700"/>
    <line x1="1108" y1="124" x2="1108" y2="700"/>
    <line x1="1100" y1="124" x2="1100" y2="700"/>
    <line x1="1092" y1="124" x2="1092" y2="700"/>
    <line x1="92" y1="128" x2="1108" y2="128"/>
    <line x1="92" y1="696" x2="1108" y2="696"/>
  </g>

  <!-- Block subdivision (urban block) -->
  <g stroke="#a8d8ff" stroke-width="0.8" stroke-dasharray="4,3" fill="none" opacity="0.6">
    <rect x="120" y="160" width="980" height="500"/>
  </g>

  <!-- BUILDING A (residential tower) -->
  <g>
    <!-- Footprint -->
    <polygon points="180,200 380,200 380,560 180,560" fill="#0a2540" stroke="#e0f2fe" stroke-width="1.8"/>
    <!-- Floors pattern -->
    <g stroke="#a8d8ff" stroke-width="0.4" opacity="0.5">
      <line x1="180" y1="225" x2="380" y2="225"/>
      <line x1="180" y1="250" x2="380" y2="250"/>
      <line x1="180" y1="275" x2="380" y2="275"/>
      <line x1="180" y1="300" x2="380" y2="300"/>
      <line x1="180" y1="325" x2="380" y2="325"/>
      <line x1="180" y1="350" x2="380" y2="350"/>
      <line x1="180" y1="375" x2="380" y2="375"/>
      <line x1="180" y1="400" x2="380" y2="400"/>
      <line x1="180" y1="425" x2="380" y2="425"/>
      <line x1="180" y1="450" x2="380" y2="450"/>
      <line x1="180" y1="475" x2="380" y2="475"/>
      <line x1="180" y1="500" x2="380" y2="500"/>
      <line x1="180" y1="525" x2="380" y2="525"/>
    </g>
    <!-- Vertical structure -->
    <line x1="220" y1="200" x2="220" y2="560" stroke="#a8d8ff" stroke-width="0.4" opacity="0.5"/>
    <line x1="260" y1="200" x2="260" y2="560" stroke="#a8d8ff" stroke-width="0.4" opacity="0.5"/>
    <line x1="300" y1="200" x2="300" y2="560" stroke="#a8d8ff" stroke-width="0.4" opacity="0.5"/>
    <line x1="340" y1="200" x2="340" y2="560" stroke="#a8d8ff" stroke-width="0.4" opacity="0.5"/>
    <!-- Roof -->
    <rect x="175" y="190" width="210" height="14" fill="#0a2540" stroke="#e0f2fe" stroke-width="1.2"/>
    <!-- Center label -->
    <text x="280" y="385" text-anchor="middle" fill="#e0f2fe" font-family="ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="0.1em">TORRE A</text>
    <text x="280" y="402" text-anchor="middle" fill="#a8d8ff" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.15em" opacity="0.85">RESIDENCIAL</text>
    <text x="280" y="416" text-anchor="middle" fill="#a8d8ff" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.1em" opacity="0.7">14 NIVELES</text>
  </g>

  <!-- BUILDING B (commercial/mixed use) -->
  <g>
    <polygon points="420,200 700,200 700,460 420,460" fill="#0a2540" stroke="#e0f2fe" stroke-width="1.8"/>
    <g stroke="#a8d8ff" stroke-width="0.4" opacity="0.5">
      <line x1="420" y1="240" x2="700" y2="240"/>
      <line x1="420" y1="280" x2="700" y2="280"/>
      <line x1="420" y1="320" x2="700" y2="320"/>
      <line x1="420" y1="360" x2="700" y2="360"/>
      <line x1="420" y1="400" x2="700" y2="400"/>
      <line x1="420" y1="440" x2="700" y2="440"/>
      <line x1="450" y1="200" x2="450" y2="460"/>
      <line x1="490" y1="200" x2="490" y2="460"/>
      <line x1="530" y1="200" x2="530" y2="460"/>
      <line x1="560" y1="200" x2="560" y2="460"/>
      <line x1="600" y1="200" x2="600" y2="460"/>
      <line x1="640" y1="200" x2="640" y2="460"/>
      <line x1="670" y1="200" x2="670" y2="460"/>
    </g>
    <rect x="415" y="190" width="290" height="14" fill="#0a2540" stroke="#e0f2fe" stroke-width="1.2"/>
    <text x="560" y="320" text-anchor="middle" fill="#e0f2fe" font-family="ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="0.1em">EDIFICIO B</text>
    <text x="560" y="338" text-anchor="middle" fill="#a8d8ff" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.15em" opacity="0.85">MIXTO</text>
    <text x="560" y="352" text-anchor="middle" fill="#a8d8ff" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.1em" opacity="0.7">8 NIVELES</text>
  </g>

  <!-- BUILDING C (cultural pavilion) -->
  <g>
    <polygon points="740,200 1020,200 1020,400 740,400" fill="#0a2540" stroke="#e0f2fe" stroke-width="1.8"/>
    <g stroke="#a8d8ff" stroke-width="0.4" opacity="0.5">
      <line x1="740" y1="240" x2="1020" y2="240"/>
      <line x1="740" y1="280" x2="1020" y2="280"/>
      <line x1="740" y1="320" x2="1020" y2="320"/>
      <line x1="740" y1="360" x2="1020" y2="360"/>
      <line x1="780" y1="200" x2="780" y2="400"/>
      <line x1="830" y1="200" x2="830" y2="400"/>
      <line x1="880" y1="200" x2="880" y2="400"/>
      <line x1="930" y1="200" x2="930" y2="400"/>
      <line x1="980" y1="200" x2="980" y2="400"/>
    </g>
    <rect x="735" y="190" width="290" height="14" fill="#0a2540" stroke="#e0f2fe" stroke-width="1.2"/>
    <text x="880" y="290" text-anchor="middle" fill="#e0f2fe" font-family="ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="0.1em">PAVELLÓN C</text>
    <text x="880" y="308" text-anchor="middle" fill="#a8d8ff" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.15em" opacity="0.85">CULTURAL</text>
    <text x="880" y="322" text-anchor="middle" fill="#a8d8ff" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.1em" opacity="0.7">5 NIVELES</text>
  </g>

  <!-- Central plaza -->
  <g>
    <rect x="420" y="480" width="600" height="80" fill="#0a2540" stroke="#e0f2fe" stroke-width="1.2"/>
    <rect x="420" y="480" width="600" height="80" fill="url(#dots3)"/>
    <!-- Plaza grid -->
    <g stroke="#a8d8ff" stroke-width="0.4" opacity="0.4">
      <line x1="420" y1="500" x2="1020" y2="500"/>
      <line x1="420" y1="520" x2="1020" y2="520"/>
      <line x1="420" y1="540" x2="1020" y2="540"/>
      <line x1="480" y1="480" x2="480" y2="560"/>
      <line x1="540" y1="480" x2="540" y2="560"/>
      <line x1="600" y1="480" x2="600" y2="560"/>
      <line x1="660" y1="480" x2="660" y2="560"/>
      <line x1="720" y1="480" x2="720" y2="560"/>
      <line x1="780" y1="480" x2="780" y2="560"/>
      <line x1="840" y1="480" x2="840" y2="560"/>
      <line x1="900" y1="480" x2="900" y2="560"/>
      <line x1="960" y1="480" x2="960" y2="560"/>
    </g>
  </g>
  <text x="720" y="525" text-anchor="middle" fill="#e0f2fe" font-family="ui-monospace, monospace" font-size="9" letter-spacing="0.15em" opacity="0.85">PLAZA CENTRAL</text>

  <!-- Pedestrian walkways -->
  <g stroke="#a8d8ff" stroke-width="0.8" fill="none" stroke-dasharray="4,3" opacity="0.7">
    <line x1="280" y1="600" x2="940" y2="600"/>
    <line x1="600" y1="560" x2="600" y2="680"/>
  </g>

  <!-- Trees along walkways -->
  <g stroke="#e0f2fe" stroke-width="0.6" fill="none" opacity="0.75">
    <circle cx="220" cy="600" r="8"/>
    <circle cx="320" cy="600" r="8"/>
    <circle cx="420" cy="600" r="8"/>
    <circle cx="520" cy="600" r="8"/>
    <circle cx="720" cy="600" r="8"/>
    <circle cx="820" cy="600" r="8"/>
    <circle cx="920" cy="600" r="8"/>
    <circle cx="1020" cy="600" r="8"/>

    <circle cx="600" cy="640" r="8"/>
    <circle cx="600" cy="680" r="8"/>
  </g>

  <!-- Access points (arrows showing entry) -->
  <g stroke="#7dd3fc" stroke-width="1" fill="none" opacity="0.8">
    <line x1="280" y1="650" x2="280" y2="600"/>
    <polygon points="280,600 276,608 284,608" fill="#7dd3fc" stroke="none"/>
  </g>
  <g stroke="#7dd3fc" stroke-width="1" fill="none" opacity="0.8">
    <line x1="940" y1="650" x2="940" y2="600"/>
    <polygon points="940,600 936,608 944,608" fill="#7dd3fc" stroke="none"/>
  </g>

  <!-- Car parking icon (small) -->
  <g stroke="#a8d8ff" stroke-width="0.5" fill="none" opacity="0.6">
    <rect x="160" y="600" width="180" height="50" stroke-dasharray="3,3"/>
    <line x1="190" y1="600" x2="190" y2="650" stroke-width="0.4"/>
    <line x1="220" y1="600" x2="220" y2="650" stroke-width="0.4"/>
    <line x1="250" y1="600" x2="250" y2="650" stroke-width="0.4"/>
    <line x1="280" y1="600" x2="280" y2="650" stroke-width="0.4"/>
    <line x1="310" y1="600" x2="310" y2="650" stroke-width="0.4"/>
  </g>
  <text x="250" y="685" text-anchor="middle" fill="#a8d8ff" font-family="ui-monospace, monospace" font-size="8" opacity="0.7" letter-spacing="0.15em">ESTACIONAMIENTO</text>

  <!-- Bike parking -->
  <g stroke="#a8d8ff" stroke-width="0.5" fill="none" opacity="0.6">
    <rect x="960" y="600" width="160" height="40" stroke-dasharray="3,3"/>
  </g>
  <text x="1040" y="660" text-anchor="middle" fill="#a8d8ff" font-family="ui-monospace, monospace" font-size="8" opacity="0.7" letter-spacing="0.15em">BICIPORTES</text>

  <!-- Sun path (sun study) -->
  <g stroke="#a8d8ff" stroke-width="0.4" fill="none" stroke-dasharray="2,2" opacity="0.45">
    <path d="M 100 200 Q 600 100 1100 200"/>
    <path d="M 100 350 Q 600 250 1100 350"/>
  </g>
  <text x="600" y="170" text-anchor="middle" fill="#a8d8ff" font-family="ui-monospace, monospace" font-size="7" opacity="0.6" letter-spacing="0.15em">ESTUDIO SOLAR · VERANO 12:00 / 15:00</text>

  <!-- North arrow -->
  <g transform="translate(1100, 80)" stroke="#e0f2fe" fill="none" stroke-width="1.2">
    <circle r="28"/>
    <line x1="0" y1="-28" x2="0" y2="28" stroke-width="0.4" opacity="0.4"/>
    <line x1="-28" y1="0" x2="28" y2="0" stroke-width="0.4" opacity="0.4"/>
    <polygon points="0,-26 -5,2 0,-6 5,2" fill="#e0f2fe" stroke="none"/>
    <polygon points="0,26 -5,-2 0,6 5,-2" fill="#a8d8ff" stroke="none" opacity="0.5"/>
    <text y="-34" text-anchor="middle" fill="#e0f2fe" font-family="ui-monospace, monospace" font-size="10" stroke="none">N</text>
  </g>

  <!-- Dimension lines -->
  <g stroke="#a8d8ff" stroke-width="0.6" fill="none" opacity="0.85">
    <line x1="180" y1="50" x2="180" y2="155"/>
    <line x1="1020" y1="50" x2="1020" y2="155"/>
    <line x1="180" y1="70" x2="1020" y2="70"/>
    <polygon points="180,70 190,67 190,73" fill="#a8d8ff" stroke="none"/>
    <polygon points="1020,70 1010,67 1010,73" fill="#a8d8ff" stroke="none"/>
  </g>

  <!-- Dimension text -->
  <g fill="#a8d8ff" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" letter-spacing="0.05em">
    <text x="600" y="65" text-anchor="middle">84.00 m</text>
  </g>

  <!-- Axis labels -->
  <g fill="#7dd3fc" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="500" opacity="0.85">
    <text x="175" y="45">A</text>
    <text x="375" y="45">B</text>
    <text x="595" y="45">C</text>
    <text x="795" y="45">D</text>
    <text x="1015" y="45">E</text>
    <text x="100" y="180">1</text>
    <text x="100" y="380">2</text>
    <text x="100" y="580">3</text>
  </g>

  <!-- Title block (top left) -->
  <g transform="translate(60, 50)">
    <rect width="320" height="50" fill="none" stroke="#a8d8ff" stroke-width="0.6"/>
    <line x1="0" y1="18" x2="320" y2="18" stroke="#a8d8ff" stroke-width="0.3"/>
    <g fill="#e0f2fe" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
      <text x="8" y="13" font-size="8" opacity="0.7" letter-spacing="0.15em">LAM. U-01 · PLANTA URBANA CONJUNTO</text>
      <text x="8" y="34" font-size="11" letter-spacing="0.1em" font-weight="500">DESARROLLO MIXTO CENTRO</text>
      <text x="8" y="46" font-size="8" opacity="0.65" letter-spacing="0.1em">ESTUDIO CALLI · 2026</text>
    </g>
  </g>

  <!-- Scale bar -->
  <g transform="translate(960, 760)" stroke="#a8d8ff" fill="none">
    <line x1="0" y1="0" x2="120" y2="0" stroke-width="0.8"/>
    <line x1="0" y1="-3" x2="0" y2="3" stroke-width="0.8"/>
    <line x1="30" y1="-2" x2="30" y2="2" stroke-width="0.5"/>
    <line x1="60" y1="-2" x2="60" y2="2" stroke-width="0.5"/>
    <line x1="90" y1="-2" x2="90" y2="2" stroke-width="0.5"/>
    <line x1="120" y1="-3" x2="120" y2="3" stroke-width="0.8"/>
    <text x="60" y="15" text-anchor="middle" fill="#a8d8ff" font-family="ui-monospace, monospace" font-size="8" stroke="none">ESC 1:250 · 0—12m</text>
  </g>
</svg>
