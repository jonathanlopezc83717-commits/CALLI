<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Plano maestro conceptual del proyecto arquitectónico">
  <defs>
    <pattern id="grid-p" patternUnits="userSpaceOnUse" width="20" height="20">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#a8d8ff" stroke-width="0.2" opacity="0.2"/>
    </pattern>
    <pattern id="hatch-p" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#a8d8ff" stroke-width="0.4" opacity="0.5"/>
    </pattern>
    <pattern id="grass" patternUnits="userSpaceOnUse" width="8" height="8">
      <circle cx="4" cy="4" r="0.6" fill="#a8d8ff" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#0a2540"/>
  <rect width="1280" height="720" fill="url(#grid-p)"/>

  <!-- Outer plot boundary (dashed) -->
  <g stroke="#a8d8ff" stroke-width="0.7" stroke-dasharray="8,4" fill="none" opacity="0.7">
    <rect x="180" y="140" width="920" height="480"/>
  </g>

  <!-- Inner site boundary -->
  <g stroke="#e0f2fe" stroke-width="1.4" fill="none">
    <rect x="280" y="220" width="720" height="380"/>
  </g>

  <!-- Site hatching (subtle texture for landscape area) -->
  <g>
    <rect x="280" y="220" width="720" height="380" fill="url(#grass)" opacity="0.6"/>
  </g>

  <!-- Central building footprint (main structure) -->
  <g>
    <polygon points="450,310 780,310 820,360 820,510 410,510 410,360" fill="#0a2540" stroke="#e0f2fe" stroke-width="1.8"/>
    <!-- Inner courtyard -->
    <rect x="500" y="380" width="220" height="100" fill="#0a2540" stroke="#e0f2fe" stroke-width="1.2"/>
    <rect x="500" y="380" width="220" height="100" fill="url(#hatch-p)" opacity="0.5"/>
  </g>

  <!-- Secondary building (smaller pavilion) -->
  <g>
    <polygon points="850,440 970,440 970,520 850,520" fill="#0a2540" stroke="#e0f2fe" stroke-width="1.4"/>
  </g>

  <!-- Access path / circulation -->
  <g stroke="#a8d8ff" stroke-width="1" fill="none" stroke-dasharray="6,3" opacity="0.75">
    <path d="M 180 380 L 410 380"/>
    <path d="M 615 510 L 615 600 L 1000 600"/>
  </g>

  <!-- Walking paths (solid) -->
  <g stroke="#e0f2fe" stroke-width="0.8" fill="none" opacity="0.85">
    <path d="M 410 380 L 450 360 L 615 360"/>
    <path d="M 615 480 L 780 480 L 820 510"/>
  </g>

  <!-- Trees (various sizes - circles) -->
  <g stroke="#e0f2fe" stroke-width="0.7" fill="none" opacity="0.85">
    <!-- Large trees -->
    <circle cx="320" cy="280" r="18"/>
    <circle cx="320" cy="280" r="12" stroke-width="0.4" opacity="0.5"/>
    <line x1="320" y1="298" x2="320" y2="305" stroke-width="0.5"/>

    <circle cx="950" cy="290" r="22"/>
    <circle cx="950" cy="290" r="14" stroke-width="0.4" opacity="0.5"/>
    <line x1="950" y1="312" x2="950" y2="320" stroke-width="0.5"/>

    <circle cx="320" cy="560" r="20"/>
    <circle cx="320" cy="560" r="13" stroke-width="0.4" opacity="0.5"/>
    <line x1="320" y1="580" x2="320" y2="588" stroke-width="0.5"/>

    <circle cx="900" cy="580" r="24"/>
    <circle cx="900" cy="580" r="16" stroke-width="0.4" opacity="0.5"/>
    <line x1="900" y1="604" x2="900" y2="612" stroke-width="0.5"/>

    <!-- Medium trees -->
    <circle cx="370" cy="350" r="14"/>
    <circle cx="430" cy="540" r="16"/>
    <circle cx="800" cy="550" r="14"/>
    <circle cx="870" cy="380" r="16"/>
    <circle cx="730" cy="270" r="14"/>

    <!-- Small trees -->
    <circle cx="350" cy="450" r="10"/>
    <circle cx="780" cy="380" r="10"/>
    <circle cx="900" cy="460" r="10"/>
    <circle cx="500" cy="560" r="10"/>
  </g>

  <!-- Pool/water feature -->
  <g stroke="#e0f2fe" stroke-width="1.2" fill="none" opacity="0.9">
    <rect x="850" y="320" width="100" height="60"/>
    <line x1="860" y1="332" x2="940" y2="332" stroke-width="0.4" opacity="0.6"/>
    <line x1="860" y1="345" x2="940" y2="345" stroke-width="0.4" opacity="0.6"/>
    <line x1="860" y1="358" x2="940" y2="358" stroke-width="0.4" opacity="0.6"/>
    <line x1="860" y1="370" x2="940" y2="370" stroke-width="0.4" opacity="0.6"/>
  </g>

  <!-- Plaza (squares pattern) -->
  <g stroke="#a8d8ff" stroke-width="0.6" fill="none" opacity="0.7">
    <rect x="290" y="380" width="100" height="100" stroke-dasharray="3,3"/>
  </g>
  <g fill="#a8d8ff" opacity="0.5">
    <rect x="296" y="386" width="20" height="20"/>
    <rect x="324" y="386" width="20" height="20"/>
    <rect x="352" y="386" width="20" height="20"/>
    <rect x="296" y="414" width="20" height="20"/>
    <rect x="324" y="414" width="20" height="20"/>
    <rect x="352" y="414" width="20" height="20"/>
    <rect x="296" y="442" width="20" height="20"/>
    <rect x="324" y="442" width="20" height="20"/>
    <rect x="352" y="442" width="20" height="20"/>
  </g>

  <!-- Contour lines (terrain) -->
  <g stroke="#a8d8ff" stroke-width="0.4" fill="none" opacity="0.5">
    <path d="M 290 240 Q 640 230 990 240"/>
    <path d="M 280 260 Q 640 250 1000 260"/>
    <path d="M 270 580 Q 640 570 1010 580"/>
    <path d="M 280 560 Q 640 550 1000 560"/>
  </g>

  <!-- North arrow -->
  <g transform="translate(1140, 110)" stroke="#e0f2fe" fill="none" stroke-width="1.2">
    <circle r="30"/>
    <line x1="0" y1="-30" x2="0" y2="30" stroke-width="0.4" opacity="0.4"/>
    <line x1="-30" y1="0" x2="30" y2="0" stroke-width="0.4" opacity="0.4"/>
    <polygon points="0,-28 -5,2 0,-6 5,2" fill="#e0f2fe" stroke="none"/>
    <polygon points="0,28 -5,-2 0,6 5,-2" fill="#a8d8ff" stroke="none" opacity="0.5"/>
    <text y="-36" text-anchor="middle" fill="#e0f2fe" font-family="ui-monospace, monospace" font-size="11" stroke="none">N</text>
  </g>

  <!-- Dimension lines -->
  <g stroke="#a8d8ff" stroke-width="0.6" fill="none" opacity="0.85">
    <!-- Top -->
    <line x1="280" y1="100" x2="280" y2="215"/>
    <line x1="1000" y1="100" x2="1000" y2="215"/>
    <line x1="280" y1="115" x2="1000" y2="115"/>
    <polygon points="280,115 290,112 290,118" fill="#a8d8ff" stroke="none"/>
    <polygon points="1000,115 990,112 990,118" fill="#a8d8ff" stroke="none"/>

    <!-- Left -->
    <line x1="140" y1="220" x2="275" y2="220"/>
    <line x1="140" y1="600" x2="275" y2="600"/>
    <line x1="155" y1="220" x2="155" y2="600" stroke-dasharray="3,3" opacity="0.5"/>
  </g>

  <!-- Dimension text -->
  <g fill="#a8d8ff" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" letter-spacing="0.05em">
    <text x="640" y="110" text-anchor="middle">48.00 m</text>
    <text x="120" y="410" text-anchor="middle" transform="rotate(-90 120 410)">25.00 m</text>
  </g>

  <!-- Axis labels -->
  <g fill="#7dd3fc" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" font-weight="500" opacity="0.85">
    <text x="275" y="88">A</text>
    <text x="535" y="88">B</text>
    <text x="745" y="88">C</text>
    <text x="995" y="88">D</text>
    <text x="135" y="225">1</text>
    <text x="135" y="415">2</text>
    <text x="135" y="595">3</text>
  </g>

  <!-- Area labels -->
  <g fill="#e0f2fe" font-family="ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.1em">
    <text x="615" y="430" text-anchor="middle" font-size="10" opacity="0.9">PATIO CENTRAL</text>
    <text x="340" y="430" text-anchor="middle" font-size="9" opacity="0.75">PLAZA DE ACCESO</text>
    <text x="900" y="355" text-anchor="middle" font-size="8" opacity="0.75">ESPEJO DE AGUA</text>
    <text x="910" y="485" text-anchor="middle" font-size="8" opacity="0.75">PAVELLÓN</text>
  </g>

  <!-- Title block (top left) -->
  <g transform="translate(60, 50)">
    <rect width="320" height="50" fill="none" stroke="#a8d8ff" stroke-width="0.6"/>
    <line x1="0" y1="18" x2="320" y2="18" stroke="#a8d8ff" stroke-width="0.3"/>
    <g fill="#e0f2fe" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
      <text x="8" y="13" font-size="8" opacity="0.7" letter-spacing="0.15em">LAM. M-01 · PLANO MAESTRO CONCEPTUAL</text>
      <text x="8" y="34" font-size="11" letter-spacing="0.1em" font-weight="500">ESTRATEGIA TERRITORIAL</text>
      <text x="8" y="46" font-size="8" opacity="0.65" letter-spacing="0.1em">ESTUDIO CALLI · 2026</text>
    </g>
  </g>

  <!-- Scale bar -->
  <g transform="translate(950, 660)" stroke="#a8d8ff" fill="none">
    <line x1="0" y1="0" x2="160" y2="0" stroke-width="0.8"/>
    <line x1="0" y1="-3" x2="0" y2="3" stroke-width="0.8"/>
    <line x1="40" y1="-2" x2="40" y2="2" stroke-width="0.5"/>
    <line x1="80" y1="-2" x2="80" y2="2" stroke-width="0.5"/>
    <line x1="120" y1="-2" x2="120" y2="2" stroke-width="0.5"/>
    <line x1="160" y1="-3" x2="160" y2="3" stroke-width="0.8"/>
    <text x="80" y="16" text-anchor="middle" fill="#a8d8ff" font-family="ui-monospace, monospace" font-size="8" stroke="none">ESC 1:200 · 0—8m</text>
  </g>
</svg>
