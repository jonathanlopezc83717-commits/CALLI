  <!-- Site of interest (the studio location) - HIGHLIGHTED -->
  <g>
    <!-- Glow/halo -->
    <rect x="408" y="528" width="284" height="464" fill="#7dd3fc" opacity="0.05"/>
    <!-- Site polygon -->
    <polygon points="420,540 680,540 680,980 420,980" fill="none" stroke="#7dd3fc" stroke-width="2.5"/>
    <!-- Inner divisions -->
    <line x1="420" y1="700" x2="680" y2="700" stroke="#7dd3fc" stroke-width="1.2"/>
    <line x1="550" y1="540" x2="550" y2="700" stroke="#7dd3fc" stroke-width="1.2"/>
    <line x1="550" y1="700" x2="550" y2="980" stroke="#7dd3fc" stroke-width="1.2"/>

    <!-- Building inside the site -->
    <rect x="440" y="560" width="100" height="120" fill="#0a2540" stroke="#7dd3fc" stroke-width="1.4"/>
    <text x="490" y="615" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.1em">EDIFICIO</text>
    <text x="490" y="628" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="7" letter-spacing="0.15em">PRINCIPAL</text>

    <rect x="440" y="720" width="100" height="80" fill="#0a2540" stroke="#7dd3fc" stroke-width="1.2"/>
    <text x="490" y="755" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.1em">ANEXO</text>

    <rect x="440" y="820" width="220" height="140" fill="#0a2540" stroke="#7dd3fc" stroke-width="1.2"/>
    <text x="550" y="880" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.1em">JARDÍN / PATIO</text>
    <text x="550" y="900" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="7" opacity="0.8" letter-spacing="0.1em">ESTUDIO</text>

    <rect x="560" y="560" width="100" height="120" fill="#0a2540" stroke="#7dd3fc" stroke-width="1.2"/>
    <text x="610" y="625" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.1em">ESTUDIO</text>

    <rect x="560" y="720" width="100" height="80" fill="#0a2540" stroke="#7dd3fc" stroke-width="1.2"/>
    <text x="610" y="765" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.1em">TALLER</text>
  </g>

  <!-- Site label and marker -->
  <g>
    <circle cx="550" cy="760" r="14" fill="none" stroke="#7dd3fc" stroke-width="1.5"/>
    <circle cx="550" cy="760" r="5" fill="#7dd3fc"/>
    <line x1="550" y1="774" x2="550" y2="810" stroke="#7dd3fc" stroke-width="0.8"/>
    <line x1="550" y1="810" x2="750" y2="850" stroke="#7dd3fc" stroke-width="0.8" stroke-dasharray="3,3"/>
    <line x1="750" y1="850" x2="850" y2="850" stroke="#7dd3fc" stroke-width="0.8"/>
    <line x1="850" y1="850" x2="850" y2="845" stroke="#7dd3fc" stroke-width="0.8"/>
  </g>
  <g fill="#7dd3fc" font-family="ui-monospace, monospace">
    <rect x="730" y="855" width="180" height="40" fill="#0a2540" stroke="#7dd3fc" stroke-width="0.6"/>
    <text x="820" y="872" text-anchor="middle" font-size="9" letter-spacing="0.15em" font-weight="500">ESTUDIO CALLI</text>
    <text x="820" y="887" text-anchor="middle" font-size="7" letter-spacing="0.1em" opacity="0.85">AV. PRINCIPAL 248</text>
  </g>

  <!-- Trees scattered -->
  <g stroke="#a8d8ff" stroke-width="0.5" fill="none" opacity="0.6">
    <circle cx="370" cy="380" r="4"/>
    <circle cx="380" cy="430" r="4"/>
    <circle cx="370" cy="480" r="4"/>
    <circle cx="390" cy="550" r="4"/>
    <circle cx="370" cy="700" r="4"/>
    <circle cx="380" cy="850" r="4"/>
    <circle cx="380" cy="950" r="4"/>

    <circle cx="710" cy="380" r="4"/>
    <circle cx="720" cy="430" r="4"/>
    <circle cx="710" cy="480" r="4"/>
    <circle cx="710" cy="700" r="4"/>
    <circle cx="720" cy="850" r="4"/>
    <circle cx="710" cy="950" r="4"/>

    <circle cx="200" cy="500" r="4"/>
    <circle cx="280" cy="500" r="4"/>
    <circle cx="900" cy="500" r="4"/>
    <circle cx="800" cy="500" r="4"/>
