  <!-- Scale bar -->
  <g transform="translate(80, 1190)" stroke="#a8d8ff" fill="none">
    <line x1="0" y1="0" x2="160" y2="0" stroke-width="0.8"/>
    <line x1="0" y1="-3" x2="0" y2="3" stroke-width="0.8"/>
    <line x1="40" y1="-2" x2="40" y2="2" stroke-width="0.5"/>
    <line x1="80" y1="-2" x2="80" y2="2" stroke-width="0.5"/>
    <line x1="120" y1="-2" x2="120" y2="2" stroke-width="0.5"/>
    <line x1="160" y1="-3" x2="160" y2="3" stroke-width="0.8"/>
    <text x="80" y="18" text-anchor="middle" fill="#a8d8ff" font-family="ui-monospace, monospace" font-size="8" stroke="none">ESC 1:500 · 0—40m</text>
  </g>
