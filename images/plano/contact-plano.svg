    <text x="530" y="55" text-anchor="middle">2 CUADRAS · 200 m</text>
  </g>

  <!-- Title block (top left) -->
  <g transform="translate(60, 80)">
    <rect width="280" height="80" fill="none" stroke="#a8d8ff" stroke-width="0.6"/>
    <line x1="0" y1="22" x2="280" y2="22" stroke="#a8d8ff" stroke-width="0.4"/>
    <line x1="0" y1="50" x2="280" y2="50" stroke="#a8d8ff" stroke-width="0.4"/>
    <g fill="#e0f2fe" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
      <text x="10" y="14" font-size="8" opacity="0.7" letter-spacing="0.15em">LAM. S-01 · PLANO UBICACIÓN</text>
      <text x="10" y="40" font-size="13" letter-spacing="0.1em" font-weight="500">CONTEXTO URBANO</text>
      <text x="10" y="66" font-size="8" opacity="0.7" letter-spacing="0.1em">CDMX · COL. CENTRO</text>
      <text x="10" y="78" font-size="7" opacity="0.6" letter-spacing="0.1em">ESTUDIO CALLI</text>
    </g>
  </g>

  <!-- Legend / North arrow with scale (bottom right) -->
  <g transform="translate(750, 1140)">
    <rect width="180" height="80" fill="none" stroke="#a8d8ff" stroke-width="0.6"/>
    <g fill="#e0f2fe" font-family="ui-monospace, monospace" font-size="8" letter-spacing="0.1em">
      <text x="10" y="14" opacity="0.7">REFERENCIAS</text>

      <rect x="10" y="22" width="14" height="8" fill="#0a2540" stroke="#a8d8ff" stroke-width="0.5"/>
      <text x="30" y="29" opacity="0.85">EDIFICACIÓN</text>

      <rect x="10" y="36" width="14" height="8" fill="url(#park)" stroke="#a8d8ff" stroke-width="0.5"/>
      <text x="30" y="43" opacity="0.85">ÁREA VERDE</text>

      <rect x="10" y="50" width="14" height="8" fill="#0a2540" stroke="#7dd3fc" stroke-width="0.8"/>
      <text x="30" y="57" fill="#7dd3fc" font-weight="500">SITIO CALLI</text>
    </g>
