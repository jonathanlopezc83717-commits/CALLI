<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1280" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Plano de ubicación y contexto urbano">
  <defs>
    <pattern id="grid4" patternUnits="userSpaceOnUse" width="20" height="20">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#a8d8ff" stroke-width="0.2" opacity="0.2"/>
    </pattern>
    <pattern id="block" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#0a2540"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#a8d8ff" stroke-width="0.3" opacity="0.5"/>
    </pattern>
    <pattern id="park" patternUnits="userSpaceOnUse" width="10" height="10">
      <circle cx="5" cy="5" r="1" fill="#a8d8ff" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1280" fill="#0a2540"/>
  <rect width="1000" height="1280" fill="url(#grid4)"/>

  <!-- Main streets (wider, with parallel lines) -->
  <g stroke="#a8d8ff" stroke-width="1" fill="none" opacity="0.85">
    <!-- Av. Principal (horizontal) -->
    <line x1="40" y1="500" x2="960" y2="500"/>
    <line x1="40" y1="520" x2="960" y2="520"/>
    <!-- Calle Norte (horizontal, top) -->
    <line x1="40" y1="240" x2="960" y2="240"/>
    <line x1="40" y1="252" x2="960" y2="252"/>
    <!-- Calle Sur (horizontal, bottom) -->
    <line x1="40" y1="1000" x2="960" y2="1000"/>
    <line x1="40" y1="1012" x2="960" y2="1012"/>

    <!-- Av. Secundaria (vertical) -->
    <line x1="380" y1="80" x2="380" y2="1200"/>
    <line x1="400" y1="80" x2="400" y2="1200"/>
    <!-- Av. Oriente (vertical) -->
    <line x1="700" y1="80" x2="700" y2="1200"/>
    <line x1="720" y1="80" x2="720" y2="1200"/>
  </g>

  <!-- Street labels -->
  <g fill="#e0f2fe" font-family="ui-monospace, monospace" font-size="10" letter-spacing="0.15em" opacity="0.85">
    <text x="100" y="225">CALLE NORTE</text>
    <text x="100" y="490" font-size="11" font-weight="500">AV. PRINCIPAL</text>
    <text x="100" y="990">CALLE SUR</text>
    <text x="365" y="100" text-anchor="middle" transform="rotate(-90 365 100)">AV. SECUNDARIA</text>
    <text x="685" y="100" text-anchor="middle" transform="rotate(-90 685 100)">AV. ORIENTE</text>
  </g>

  <!-- Street dashes (center lines) -->
  <g stroke="#a8d8ff" stroke-width="0.3" stroke-dasharray="6,4" opacity="0.5">
    <line x1="40" y1="510" x2="960" y2="510"/>
    <line x1="40" y1="246" x2="960" y2="246"/>
    <line x1="40" y1="1006" x2="960" y2="1006"/>
    <line x1="390" y1="240" x2="390" y2="500"/>
    <line x1="710" y1="240" x2="710" y2="500"/>
    <line x1="390" y1="520" x2="390" y2="1000"/>
    <line x1="710" y1="520" x2="710" y2="1000"/>
  </g>

  <!-- City blocks (buildings as small rects) -->
  <g stroke="#a8d8ff" stroke-width="0.5" fill="url(#block)" opacity="0.7">
    <!-- Block NW (top-left quadrant) -->
    <rect x="120" y="280" width="240" height="200"/>
    <rect x="120" y="280" width="240" height="200" fill="none" stroke-width="0.6"/>
    <!-- Buildings inside -->
    <g fill="#0a2540" stroke="#a8d8ff" stroke-width="0.5">
      <rect x="140" y="300" width="40" height="50"/>
      <rect x="190" y="300" width="40" height="50"/>
      <rect x="240" y="300" width="40" height="50"/>
      <rect x="290" y="300" width="40" height="50"/>
      <rect x="140" y="360" width="50" height="50"/>
      <rect x="200" y="360" width="50" height="50"/>
      <rect x="260" y="360" width="50" height="50"/>
      <rect x="320" y="360" width="30" height="50"/>
      <rect x="140" y="420" width="40" height="50"/>
      <rect x="190" y="420" width="60" height="50"/>
      <rect x="260" y="420" width="50" height="50"/>
      <rect x="320" y="420" width="30" height="50"/>
    </g>

