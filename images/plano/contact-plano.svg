    <rect x="120" y="540" width="240" height="440" fill="none" stroke-width="0.6"/>
    <g fill="#0a2540" stroke="#a8d8ff" stroke-width="0.5">
      <rect x="140" y="560" width="40" height="50"/>
      <rect x="190" y="560" width="50" height="50"/>
      <rect x="250" y="560" width="40" height="50"/>
      <rect x="300" y="560" width="50" height="50"/>
      <rect x="140" y="620" width="60" height="60"/>
      <rect x="210" y="620" width="50" height="60"/>
      <rect x="270" y="620" width="40" height="60"/>
      <rect x="320" y="620" width="30" height="60"/>
      <rect x="140" y="690" width="40" height="60"/>
      <rect x="190" y="690" width="60" height="60"/>
      <rect x="260" y="690" width="50" height="60"/>
      <rect x="320" y="690" width="30" height="60"/>
      <rect x="140" y="760" width="50" height="60"/>
      <rect x="200" y="760" width="40" height="60"/>
      <rect x="250" y="760" width="50" height="60"/>
      <rect x="310" y="760" width="40" height="60"/>
      <rect x="140" y="830" width="50" height="60"/>
      <rect x="200" y="830" width="60" height="60"/>
      <rect x="270" y="830" width="40" height="60"/>
      <rect x="320" y="830" width="30" height="60"/>
      <rect x="140" y="900" width="50" height="60"/>
      <rect x="200" y="900" width="50" height="60"/>
      <rect x="260" y="900" width="50" height="60"/>
      <rect x="320" y="900" width="30" height="60"/>
