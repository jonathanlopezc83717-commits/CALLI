    <rect x="420" y="260" width="260" height="20" fill="url(#park)" stroke="#a8d8ff" stroke-width="0.5" opacity="0.7"/>
    <text x="550" y="274" text-anchor="middle" fill="#a8d8ff" font-family="ui-monospace, monospace" font-size="8" opacity="0.8" letter-spacing="0.15em">PARQUE</text>
  </g>

  <!-- North arrow -->
  <g transform="translate(900, 100)" stroke="#e0f2fe" fill="none" stroke-width="1.2">
    <circle r="32"/>
    <line x1="0" y1="-32" x2="0" y2="32" stroke-width="0.4" opacity="0.4"/>
    <line x1="-32" y1="0" x2="32" y2="0" stroke-width="0.4" opacity="0.4"/>
    <polygon points="0,-30 -6,2 0,-6 6,2" fill="#e0f2fe" stroke="none"/>
    <polygon points="0,30 -6,-2 0,6 6,-2" fill="#a8d8ff" stroke="none" opacity="0.5"/>
    <text y="-38" text-anchor="middle" fill="#e0f2fe" font-family="ui-monospace, monospace" font-size="11" stroke="none">N</text>
  </g>

  <!-- Distance markers (walking distance circles) -->
  <g stroke="#7dd3fc" stroke-width="0.4" fill="none" stroke-dasharray="2,3" opacity="0.5">
    <circle cx="550" cy="760" r="100"/>
    <circle cx="550" cy="760" r="200"/>
  </g>
  <g fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="8" opacity="0.7" letter-spacing="0.1em">
    <text x="650" y="668">200 m</text>
    <text x="750" y="568">400 m</text>
  </g>

  <!-- Dimension lines -->
  <g stroke="#a8d8ff" stroke-width="0.6" fill="none" opacity="0.85">
    <line x1="120" y1="40" x2="120" y2="235"/>
    <line x1="940" y1="40" x2="940" y2="235"/>
    <line x1="120" y1="60" x2="940" y2="60"/>
    <polygon points="120,60 130,57 130,63" fill="#a8d8ff" stroke="none"/>
    <polygon points="940,60 930,57 930,63" fill="#a8d8ff" stroke="none"/>
  </g>

  <!-- Dimension text -->
