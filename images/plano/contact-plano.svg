    <rect x="740" y="540" width="200" height="440" fill="none" stroke-width="0.6"/>
    <g fill="#0a2540" stroke="#a8d8ff" stroke-width="0.5">
      <rect x="760" y="560" width="50" height="60"/>
      <rect x="820" y="560" width="40" height="60"/>
      <rect x="870" y="560" width="50" height="60"/>
      <rect x="760" y="630" width="60" height="60"/>
      <rect x="830" y="630" width="50" height="60"/>
      <rect x="890" y="630" width="40" height="60"/>
      <rect x="760" y="700" width="50" height="60"/>
      <rect x="820" y="700" width="60" height="60"/>
      <rect x="890" y="700" width="40" height="60"/>
      <rect x="760" y="770" width="60" height="60"/>
      <rect x="830" y="770" width="50" height="60"/>
      <rect x="890" y="770" width="40" height="60"/>
      <rect x="760" y="840" width="50" height="60"/>
      <rect x="820" y="840" width="50" height="60"/>
      <rect x="880" y="840" width="50" height="60"/>
      <rect x="760" y="910" width="60" height="60"/>
      <rect x="830" y="910" width="60" height="60"/>
