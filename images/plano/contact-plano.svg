    <rect x="420" y="280" width="260" height="200"/>
    <rect x="420" y="280" width="260" height="200" fill="none" stroke-width="0.6"/>
    <g fill="#0a2540" stroke="#a8d8ff" stroke-width="0.5">
      <rect x="440" y="300" width="50" height="40"/>
      <rect x="500" y="300" width="50" height="40"/>
      <rect x="560" y="300" width="40" height="40"/>
      <rect x="610" y="300" width="60" height="40"/>
      <rect x="440" y="350" width="40" height="50"/>
      <rect x="490" y="350" width="60" height="50"/>
      <rect x="560" y="350" width="50" height="50"/>
      <rect x="620" y="350" width="50" height="50"/>
      <rect x="440" y="410" width="50" height="50"/>
      <rect x="500" y="410" width="60" height="50"/>
      <rect x="570" y="410" width="40" height="50"/>
      <rect x="620" y="410" width="50" height="50"/>
    </g>

    <!-- Block E (right of Av. Oriente) -->
    <rect x="740" y="280" width="200" height="200"/>
    <rect x="740" y="280" width="200" height="200" fill="none" stroke-width="0.6"/>
    <g fill="#0a2540" stroke="#a8d8ff" stroke-width="0.5">
      <rect x="760" y="300" width="50" height="50"/>
      <rect x="820" y="300" width="50" height="50"/>
      <rect x="880" y="300" width="40" height="50"/>
      <rect x="760" y="360" width="60" height="40"/>
      <rect x="830" y="360" width="50" height="40"/>
      <rect x="890" y="360" width="40" height="40"/>
      <rect x="760" y="410" width="50" height="50"/>
      <rect x="820" y="410" width="40" height="50"/>
      <rect x="870" y="410" width="50" height="50"/>
    </g>

    <!-- Block SW (bottom-left) -->
